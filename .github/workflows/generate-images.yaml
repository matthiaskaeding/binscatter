name: Generate README Images

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Generate plots
        run: |
          # The README data is checked in; optional benchmark plots are skipped
          # when their local inputs are unavailable.
          uv run scripts/readme/make_plots_readme.py

      - name: Deploy to images branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TEMP_DIR=$(mktemp -d)
          mkdir -p "$TEMP_DIR/images"
          cp -r artifacts/images/. "$TEMP_DIR/images/"
          PNG_COUNT=$(find "$TEMP_DIR/images" -type f -name '*.png' | wc -l)
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "No PNG files were generated; aborting deploy." >&2
            exit 1
          fi

          # Create orphan branch
          git checkout --orphan images-temp
          git rm -rf .
          git clean -fdx
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy images back
          cp -r "$TEMP_DIR/images" .

          # Commit and force push
          git add -f images/
          git commit -m "Update README images [skip ci]"
          git push origin images-temp:images --force

          rm -rf "$TEMP_DIR"
          echo "Images deployed to 'images' branch"
