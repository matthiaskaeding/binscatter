name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install Python
      run: uv python install 3.11

    - name: Install project with dev dependencies
      run: |
        uv venv
        uv pip install -e .

    # The ruff version is pinned here and also asserted by `required-version`
    # in pyproject.toml, so the two cannot drift apart quietly. Leaving it
    # unpinned means CI silently follows ruff's latest release, whose default
    # rule set grows between versions — a green main can turn red with no
    # change to the code.
    - name: Run ruff format
      run: uv tool run ruff@0.15.8 format --check

    - name: Run ruff lint
      run: uv tool run ruff@0.15.8 check

    # Pinned for the same reason as ruff above, and matching the `ty` version
    # resolved in uv.lock. `ty@latest` is especially volatile — it is still a
    # 0.0.x tool, so each release can add diagnostics that turn a green main
    # red without a code change.
    - name: Run ty
      run: uv tool run ty@0.0.8 check src

    - name: Run fast tests (skip PySpark)
      run: uv run --no-default-groups --group ci pytest tests
