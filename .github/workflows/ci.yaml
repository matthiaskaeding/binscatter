name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install Python
      run: uv python install 3.11

    - name: Install project with dev dependencies
      run: |
        uv venv
        uv pip install -e .

    # Pinned to match .pre-commit-config.yaml, and asserted a third time by
    # `required-version` in pyproject.toml so the three cannot drift apart
    # quietly. Unpinned, `uv tool run ruff` resolves to the newest release, so
    # an upstream change to the default rule set breaks CI with no change to
    # this repo -- and diverges from what contributors' hooks enforce locally.
    - name: Run ruff format
      run: uv tool run ruff@0.16.1 format --check

    - name: Run ruff lint
      run: uv tool run ruff@0.16.1 check

    - name: Run ty
      run: uv tool run ty@latest check src

    - name: Run fast tests (skip PySpark)
      run: uv run --no-default-groups --group ci pytest tests
